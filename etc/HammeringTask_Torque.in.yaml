---
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: true
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: false
# Where to look for state libraries
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
# Where to look for state files
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
# If true, state factory will be more verbose
VerboseStateFactory: false
# Additional robots to load
robots:
  ground:
    module: env/ground
# General constraints, always on
constraints:
- type: contact
- type: dynamics
  damper: [0.1, 0.01, 0.5]
- type: compoundJoint
# Collision constraint
collisions:
- type: collision
  useMinimal: true
# Initial set of contacts
contacts:
- r2: ground
  r1Surface: LeftFoot
  r2Surface: AllGround
- r2: ground
  r1Surface: RightFoot
  r2Surface: AllGround

# Some options for a specific robot
  hrp5_p:                                                                                                                             
    posture:                                                                                                                          
      stiffness: 40.0                                                                                                                 
      weight: 100.0
  
ObserverPipelines:                                                                                                                  
    name: ObserverPipeline                                                                                                            
    gui: true                                                                                                                         
    observers:                                                                                                                        
    - type: Encoder                                                                                                                   
      config:                                                                                                                         
        velocity: encoderVelocities                                                                                                   
    - type: Attitude                                                                                                                  
      update: true                                                                                                                    
    - type: KinematicInertial                                                                                                         
      update: true                                                                                                                    
      config:                                                                                                                         
        anchorFrame:                                                                                                                  
          maxAnchorFrameDiscontinuity: 0.05                                                                                           
    - type: Tilt                                                                                                                      
      required: true                                                                                                                  
      update: true                                                                                                                    
      config:                                                                                                                         
        contacts:
          contactsDetection: Surfaces
          surfacesForContactDetection:
          - RightFootCenter
          - LeftFootCenter
# Implement some additional text states
states: {}
# Transitions map
transitions:
- [HammeringTask_Torque_Initial, OK, HammeringTask_Torque_Initial, Strict]
# Initial state
init: HammeringTask_Torque_Initial
